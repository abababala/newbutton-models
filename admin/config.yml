backend:
  name: github
  repo: abababala/newbutton-models
  branch: main
  base_url: https://sveltia-cms-auth.allanaminu247.workers.dev
  auth_endpoint: auth

media_folder: "images/models"
public_folder: "/images/models"

collections:
  - name: "models"
    label: "Models"
    folder: "models"
    create: true
    delete: true
    slug: "{{slug}}"
    label_singular: "Model"
    summary: "{{name}} — {{gender}} — {{category}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Gender"
        name: "gender"
        widget: "select"
        options: ["women", "men"]
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Runway", "Editorial", "Streetwear", "Commercial"]
      - { label: "Photo (main)", name: "image", widget: "image" }
      - label: "Gallery (additional photos)"
        name: "images"
        widget: "list"
        field: { label: "Photo", name: "image", widget: "image" }
        required: false
      - { label: "Height", name: "height", widget: "string", required: false }
      - { label: "City", name: "city", widget: "string", required: false }
      - { label: "Active", name: "active", widget: "boolean", default: true }
