backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME   # <-- change this after you push to GitHub
  branch: main

# Netlify serves media uploads from this folder
media_folder: "images/models"
public_folder: "/images/models"

collections:
  - name: "models"
    label: "Models"
    folder: "models"
    create: true
    delete: true
    slug: "{{slug}}"
    label_singular: "Model"
    summary: "{{name}} — {{category}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Runway", "Editorial", "Streetwear", "Commercial"]
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Height", name: "height", widget: "string", required: false }
      - { label: "City", name: "city", widget: "string", required: false }
      - { label: "Active", name: "active", widget: "boolean", default: true }
